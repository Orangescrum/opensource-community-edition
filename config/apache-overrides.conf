# Loaded at server-config scope from /etc/apache2/conf-enabled/zz-overrides.conf.

# Trust the host Apache reverse proxy so X-Forwarded-For is honored.
# (mod_remoteip is enabled at startup via the container command.)
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 127.0.0.1
RemoteIPInternalProxy 192.168.0.0/16
RemoteIPInternalProxy 172.16.0.0/12
RemoteIPInternalProxy 10.0.0.0/8

# Hide server version (these are server-config directives, can't live in <VirtualHost>).
ServerTokens Prod
ServerSignature Off
