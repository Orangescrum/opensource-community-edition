<VirtualHost *:80>
	# The ServerName directive sets the request scheme, hostname and port that
	# the server uses to identify itself. This is used when creating
	# redirection URLs. In the context of virtual hosts, the ServerName
	# specifies what hostname must appear in the request's Host: header to
	# match this virtual host. For the default virtual host (this file) this
	# value is not decisive as it is used as a last resort host regardless.
	# However, you must set it for any further virtual host explicitly.
	#ServerName www.example.com

	ServerAdmin support@orangescrum.com
	# Point the document root at webroot/ so that config/, src/, logs/, tmp/ and
	# vendor/ sit ABOVE it and can never be served by Apache — not even if
	# mod_rewrite is disabled. CakePHP's webroot/.htaccess handles front-controller
	# routing to index.php from here.
	DocumentRoot /var/www/html/webroot

	<Directory /var/www/html/webroot/>
                DirectoryIndex index.php index.html
                Options -Indexes
                Options FollowSymLinks
                #Options Includes FollowSymLinks MultiViews
                AllowOverride All
                Order allow,deny
                allow from all
	</Directory>

	# ES module + WebAssembly MIME types — browsers reject .mjs / .wasm
	# under strict module-script MIME checking unless served as
	# application/javascript / application/wasm. Apache's default
	# /etc/mime.types doesn't include .mjs.
	AddType application/javascript .mjs
	AddType application/wasm .wasm

	# Security Headers - Defense in depth approach
	# X-Frame-Options and Content-Security-Policy are set by SecurityHeadersMiddleware
	# so the policy can vary per-request.
	Header always set X-Content-Type-Options "nosniff"
	Header always set X-XSS-Protection "1; mode=block"
	Header always set Referrer-Policy "strict-origin-when-cross-origin"
	# HSTS Header - Force HTTPS for 1 year
	Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

	# Available loglevels: trace8, ..., trace1, debug, info, notice, warn,
	# error, crit, alert, emerg.
	# It is also possible to configure the loglevel for particular
	# modules, e.g.
	#LogLevel info ssl:warn

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	# For most configuration files from conf-available/, which are
	# enabled or disabled at a global level, it is possible to
	# include a line for only one particular virtual host. For example the
	# following line enables the CGI configuration for this host only
	# after it has been globally disabled with "a2disconf".
	#Include conf-available/serve-cgi-bin.conf
</VirtualHost>
