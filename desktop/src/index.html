<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connect to Orangescrum</title>
    <style>
        :root {
            --fg: #1f2328;
            --muted: #6b7280;
            --line: #d8dce1;
            --accent: #f26c23;
            --danger: #d92d20;
            --bg: #ffffff;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --fg: #e6e8eb;
                --muted: #9aa4b2;
                --line: #333a44;
                --bg: #16191d;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--fg);
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        .card { width: 100%; max-width: 400px; padding: 0 32px; }
        h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
        p.sub { margin: 0 0 24px; font-size: 13px; color: var(--muted); line-height: 1.5; }
        label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
        input {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            font-family: inherit;
            color: var(--fg);
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 6px;
            outline: none;
            -webkit-user-select: text;
            user-select: text;
        }
        input:focus { border-color: var(--accent); }
        button {
            width: 100%;
            margin-top: 16px;
            padding: 10px 12px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            color: #fff;
            background: var(--accent);
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }
        button:disabled { opacity: .6; cursor: default; }
        .hint { margin-top: 10px; font-size: 12px; color: var(--muted); }
        .error { margin-top: 12px; font-size: 13px; color: var(--danger); min-height: 18px; }
        .newuser {
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px solid var(--line);
            font-size: 12px;
            color: var(--muted);
            line-height: 1.6;
        }
        .newuser a { color: var(--accent); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Connect to Orangescrum</h1>
        <p class="sub">Enter the address of your Orangescrum server. This is the same URL you use in the browser.</p>

        <label for="url">Server address</label>
        <input id="url" type="text" placeholder="https://work.example.com" autocomplete="off" spellcheck="false" />
        <div class="hint">http:// is assumed if you leave the scheme off.</div>

        <button id="go">Connect</button>
        <div class="error" id="err"></div>

        <div class="newuser">
            New to Orangescrum? The desktop app connects to an Orangescrum
            server — your team's, or one you host yourself.
            <a href="#" id="setup-guide">Server setup guide</a>
        </div>
    </div>

    <script type="module">
        const invoke = window.__TAURI__.core.invoke;
        const input = document.getElementById('url');
        const button = document.getElementById('go');
        const error = document.getElementById('err');

        invoke('get_server_url').then((saved) => {
            if (saved) input.value = saved;
        }).catch(() => {});

        async function connect() {
            error.textContent = '';
            button.disabled = true;
            try {
                await invoke('connect', { url: input.value });
            } catch (e) {
                error.textContent = typeof e === 'string' ? e : 'Could not connect to that address.';
                button.disabled = false;
            }
        }

        document.getElementById('setup-guide').addEventListener('click', (e) => {
            e.preventDefault();
            invoke('open_external', { url: 'https://github.com/Orangescrum/opensource-community-edition#install' }).catch(() => {});
        });

        button.addEventListener('click', connect);
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') connect(); });
        input.focus();
    </script>
</body>
</html>
